name: Preview website (fork only)

# Builds the site from this branch and publishes it to this fork's GitHub Pages
# (gh-pages branch), e.g. https://<user>.github.io/xqtl-protocol/. Not for StatFunGen.
on:
  push:
    branches: [site-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    if: github.repository != 'StatFunGen/xqtl-protocol'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
      - name: Build and publish the preview
        shell: pixi exec --spec jupyter-book --spec ghp-import --spec nbconvert -- bash -e {0}
        env:
          XQTL_SITE_URL: https://${{ github.repository_owner }}.github.io/xqtl-protocol
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python website/build_support.py --stage-widget
          npm install --global mystmd@1.13.0
          BASE_URL=/xqtl-protocol myst build --html
          python website/build_support.py --widget _build/html --redirects _build/html
          # Keep navigation and builder links inside the fork preview.
          python - <<'PY'
          import os
          from pathlib import Path
          old = b"https://statfungen.github.io/xqtl-protocol"
          new = os.environ["XQTL_SITE_URL"].encode()
          for path in Path("_build/html").rglob("*"):
              if path.is_file() and path.suffix in {".html", ".json", ".js", ".mjs", ".css", ".map"}:
                  data = path.read_bytes()
                  if old in data:
                      path.write_bytes(data.replace(old, new))
          PY
          touch _build/html/.nojekyll
          ghp-import -n -p -f _build/html
